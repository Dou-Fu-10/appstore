services:
  mihomo:
    image: metacubex/mihomo:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./data:/root/.config/mihomo
      - /dev/net/tun:/dev/net/tun
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
      - SUB_URL=${SUB_URL}
      - SUB_CRON=${SUB_CRON}
      - SECRET=${SECRET}
    labels:
      createdBy: "Apps"

  metacubexd:
    image: ghcr.io/metacubex/metacubexd:latest
    container_name: ${CONTAINER_NAME}-ui
    restart: always
    network_mode: bridge
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - META_SERVER=http://${CONTAINER_NAME}:9090
      - META_SECRET=${SECRET}

networks:
  1panel-network:
    external: true